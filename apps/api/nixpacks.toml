[phases.setup]
nixPkgs = ["nodejs_26"]
# Nixpacks' own Node map does not reach this major, so pin a nixos-unstable
# commit that ships it. Channel commits are what the Nix binary cache serves.
nixpkgsArchive = "2786a2a72088ecf32aea5b3ec52099e6a7cff78f"

[phases.install]
cmds = ["npm ci", "npx playwright install --with-deps chromium"]

[phases.build]
cmds = ["npm run build"]

# No [start]: the start command is declared once, in .railway/railway.ts.
