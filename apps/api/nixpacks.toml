[phases.setup]
nixPkgs = ["nodejs_26"]
# Nixpacks' own Node map stops at 24, so pin a nixos-unstable commit that ships
# nodejs_26 (26.13.1). Channel commits are binary-cached; a bare master commit is not.
nixpkgsArchive = "2786a2a72088ecf32aea5b3ec52099e6a7cff78f"

[phases.install]
cmds = ["npm ci", "npx playwright install --with-deps chromium"]

[phases.build]
cmds = ["npm run build"]

# No [start]: the start command is declared once, in .railway/railway.ts.
